<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="100%" height="100%">
  <defs>
    <linearGradient id="rustgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DEA584"/>
      <stop offset="100%" stop-color="#C4784A"/>
    </linearGradient>
    <linearGradient id="cyangrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CCFE6"/>
      <stop offset="100%" stop-color="#38A9C5"/>
    </linearGradient>
  </defs>

  <!-- ===== ICON: Ferris the Rust Crab + AI ===== -->
  <g transform="translate(10, 5)">
    <!-- AI neural network orbits around the crab -->
    <ellipse cx="55" cy="60" rx="52" ry="18" fill="none" stroke="#5CCFE6" stroke-width="1.2" opacity="0.4" transform="rotate(-20,55,60)"/>
    <ellipse cx="55" cy="60" rx="52" ry="18" fill="none" stroke="#5CCFE6" stroke-width="1.2" opacity="0.4" transform="rotate(20,55,60)"/>

    <!-- External connection nodes (cloud/MCP/web) -->
    <circle cx="14" cy="32" r="3.5" fill="#5CCFE6" opacity="0.7"/>
    <circle cx="96" cy="32" r="3.5" fill="#5CCFE6" opacity="0.7"/>
    <circle cx="14" cy="88" r="3.5" fill="#5CCFE6" opacity="0.7"/>
    <circle cx="96" cy="88" r="3.5" fill="#5CCFE6" opacity="0.7"/>

    <!-- Dashed lines from crab to external nodes -->
    <line x1="26" y1="38" x2="16" y2="34" stroke="#5CCFE6" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    <line x1="84" y1="38" x2="94" y2="34" stroke="#5CCFE6" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    <line x1="26" y1="82" x2="16" y2="86" stroke="#5CCFE6" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    <line x1="84" y1="82" x2="94" y2="86" stroke="#5CCFE6" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

    <!-- Crab body (hexagon - Rust shape) -->
    <polygon points="55,36 78,50 78,74 55,88 32,74 32,50"
             fill="url(#rustgrad)" stroke="#C4784A" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Crab shell highlight -->
    <polygon points="55,40 73,52 73,72 55,84 37,72 37,52"
             fill="none" stroke="#E8C4A8" stroke-width="1" opacity="0.4" stroke-linejoin="round"/>

    <!-- Crab eyes -->
    <ellipse cx="44" cy="52" rx="7" ry="9" fill="#1D2B53"/>
    <ellipse cx="66" cy="52" rx="7" ry="9" fill="#1D2B53"/>
    <ellipse cx="44" cy="52" rx="3" ry="4" fill="#5CCFE6"/>
    <ellipse cx="66" cy="52" rx="3" ry="4" fill="#5CCFE6"/>

    <!-- Crab antennae -->
    <line x1="42" y1="43" x2="35" y2="30" stroke="#DEA584" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="43" x2="75" y2="30" stroke="#DEA584" stroke-width="2" stroke-linecap="round"/>
    <circle cx="35" cy="30" r="2" fill="#DEA584"/>
    <circle cx="75" cy="30" r="2" fill="#DEA584"/>

    <!-- Crab left claw -->
    <path d="M32,56 Q10,44 8,62 Q6,78 24,68" fill="url(#rustgrad)" stroke="#C4784A" stroke-width="2" stroke-linecap="round"/>
    <path d="M12,58 Q8,52 10,48" fill="none" stroke="#DEA584" stroke-width="2" stroke-linecap="round"/>

    <!-- Crab right claw -->
    <path d="M78,56 Q100,44 102,62 Q104,78 86,68" fill="url(#rustgrad)" stroke="#C4784A" stroke-width="2" stroke-linecap="round"/>
    <path d="M98,58 Q102,52 100,48" fill="none" stroke="#DEA584" stroke-width="2" stroke-linecap="round"/>

    <!-- Crab legs -->
    <line x1="32" y1="72" x2="18" y2="78" stroke="#DEA584" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="78" x2="20" y2="88" stroke="#DEA584" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="78" y1="72" x2="92" y2="78" stroke="#DEA584" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="78" y1="78" x2="90" y2="88" stroke="#DEA584" stroke-width="2.5" stroke-linecap="round"/>

    <!-- AI nodes on orbits near the crab -->
    <circle cx="16" cy="62" r="3" fill="#5CCFE6" opacity="0.9"/>
    <circle cx="94" cy="62" r="3" fill="#5CCFE6" opacity="0.9"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g font-family="'-apple-system','BlinkMacSystemFont','Segoe UI','Helvetica Neue','Inter',system-ui,sans-serif">
    <!-- Main title: "Rust" in Rust orange, "Rig AI" in dark navy -->
    <text x="125" y="52" font-size="36" letter-spacing="-0.5">
      <tspan font-weight="700" fill="#DEA584">Rust</tspan><tspan font-weight="600" fill="#1D2B53">Rig AI</tspan>
    </text>

    <!-- Tagline -->
    <text x="126" y="74" font-size="10" font-weight="600" fill="#718096" letter-spacing="1.8">OLLAMA · MCP · S3</text>

    <!-- Bottom decorative lines -->
    <line x1="126" y1="83" x2="420" y2="83" stroke="#DEA584" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="126" y1="85" x2="340" y2="85" stroke="#5CCFE6" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
