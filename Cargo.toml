[package]
name = "Rust-Rig-AI"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-core = { version = "0.39.0", features = ["rmcp"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "process"] }
anyhow = "1.0.103"
rmcp = { version = "1.8.0", features = ["client", "transport-child-process"] }
serde_json = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1.44"
aws-sdk-s3 = "1.137.0"
aws-config = "1.8.18"
regex = "1.12.4"
rand = "0.10.2"


