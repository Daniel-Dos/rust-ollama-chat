[package]
name = "Rust-Rig-AI"
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"
codegen-units = 256
incremental=false
opt-level=0

[dependencies]
rig-core = { version = "0.40.0", features = ["rmcp"] }
rmcp = { version = "1.8.0", features = ["client", "transport-child-process"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "process"] }
anyhow = "1.0.103"
serde_json = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1.44"
aws-sdk-s3 = { version = "1.137.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
aws-config = { version = "1.8.18", default-features = false, features = ["rt-tokio", "default-https-client"] }
regex = "1.12.4"
rand = "0.10.2"
iced = { version = "0.13", features = ["tokio", "markdown"] }

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "terminal"
path = "src/terminal.rs"