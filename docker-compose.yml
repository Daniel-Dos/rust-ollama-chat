version: "3.8"
services:
 floci:
  image: floci/floci:1.5.19
  ports:
    - "4566:4566"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./data:/app/data
  environment:
    FLOCI_STORAGE_MODE: hybrid
    FLOCI_DEFAULT_REGION: localhost
    FLOCI_HOSTNAME: floci
    FLOCI_SERVICES_DYNAMODB_ENABLED: true
  restart: unless-stopped
  networks:
     - floci-network

  # ==========================================================================
  # Networking
  # ==========================================================================
networks:
    floci-network:
      name: floci-network
      driver: bridge